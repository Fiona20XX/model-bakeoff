# Tiny smoke test: short prompt, free models, no web search.
# Try: bakeoff run tasks/hello.yaml --free
name: hello
description: Smoke test. One short factual answer, scored for correctness and brevity.
system: You are a concise assistant.
user: |
  In two sentences, explain what an API rate limit is and why services use one.
models:
  - google/gemma-4-31b-it:free
  - nvidia/nemotron-3-super-120b-a12b:free
  - apodex/apodex-1.1-mini:free
judge: nvidia/nemotron-3-ultra-550b-a55b:free
synthesizer: nvidia/nemotron-3.5-lightning:free   # council mode only
web:
  enabled: false
max_tokens: 1000  # reasoning models spend tokens thinking before they answer
temperature: 0.2
runs: 1
rubric:
  - name: correctness
    weight: 0.6
    description: The explanation is accurate.
  - name: concision
    weight: 0.4
    description: Answers in two clear sentences without padding. Length is not a virtue.
