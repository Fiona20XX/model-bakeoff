[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-bakeoff"
version = "1.1.0"
description = "Compare LLMs on your own task: quality, cost, and latency, via OpenRouter."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bakeoff = "bakeoff.cli:app"

[tool.setuptools]
packages = ["bakeoff"]
